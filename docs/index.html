<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Gesture RC Car</title>
<link rel="manifest" href="manifest.json"/>
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--border:#2a2d3a;
  --text:#e8eaf0;--muted:#6b7080;
  --green:#00e676;--blue:#4dabf7;--amber:#ffb300;
  --red:#ff5252;--purple:#b39ddb;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100dvh;display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent;}
.overlay{position:fixed;inset:0;background:rgba(15,17,23,.97);
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;z-index:999;padding:24px;
  text-align:center;gap:16px;}
.overlay.gone{display:none;}
.spinner{width:48px;height:48px;border:3px solid var(--border);
  border-top-color:var(--green);border-radius:50%;
  animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.overlay h2{font-size:22px;font-weight:800;}
.overlay p{font-size:14px;color:var(--muted);line-height:1.8;max-width:320px;}
.overlay.busy h2{color:var(--amber);}
.btn{background:var(--green);border:none;border-radius:12px;
  padding:14px 28px;color:#000;font-size:15px;font-weight:800;
  cursor:pointer;width:100%;max-width:320px;}
.btn:active{transform:scale(.97);}
header{background:var(--surface);border-bottom:1px solid var(--border);
  padding:11px 16px;display:flex;justify-content:space-between;
  align-items:center;position:sticky;top:0;z-index:100;}
header h1{font-size:16px;font-weight:700;}
.pills{display:flex;gap:5px;flex-wrap:wrap;}
.pill{font-size:10px;padding:3px 9px;border-radius:20px;
  border:1px solid var(--border);color:var(--muted);
  background:var(--bg);transition:all .25s;white-space:nowrap;}
.pill.on{color:var(--green);border-color:var(--green);}
.pill.err{color:var(--red);border-color:var(--red);}
.pill.warn{color:var(--amber);border-color:var(--amber);}
main{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px;}
.cam-wrap{position:relative;background:#000;border-radius:12px;
  overflow:hidden;aspect-ratio:4/3;}
#cv{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1);}
.hud{position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:space-between;padding:10px;pointer-events:none;}
.hud-top{display:flex;justify-content:space-between;}
.gbadge{background:rgba(0,0,0,.75);padding:5px 13px;
  border-radius:20px;font-size:14px;font-weight:600;color:var(--green);}
.fps{background:rgba(0,0,0,.6);padding:3px 8px;
  border-radius:6px;font-size:11px;color:var(--muted);}
.crow{display:flex;align-items:center;gap:8px;}
.ctrack{flex:1;height:5px;background:rgba(255,255,255,.15);
  border-radius:3px;overflow:hidden;}
.cfill{height:100%;border-radius:3px;background:var(--green);
  width:0;transition:width .12s;}
.cpct{font-size:11px;color:var(--muted);min-width:30px;text-align:right;}
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:14px;}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:10px;}
.cmd{font-size:52px;font-weight:900;letter-spacing:3px;
  text-align:center;padding:8px 0;color:var(--red);transition:color .12s;}
.cmd.FORWARD{color:var(--green);}.cmd.REVERSE{color:var(--blue);}
.cmd.LEFT{color:var(--purple);}.cmd.RIGHT{color:var(--amber);}
.dpad{display:flex;flex-direction:column;align-items:center;gap:6px;}
.dr{display:flex;gap:6px;}
.db{width:60px;height:60px;border-radius:10px;background:var(--bg);
  border:1px solid var(--border);display:flex;align-items:center;
  justify-content:center;font-size:22px;color:var(--muted);transition:all .1s;}
.db.lit{background:#0d2b1a;border-color:var(--green);
  color:var(--green);box-shadow:0 0 14px rgba(0,230,118,.3);}
.db.lit.s{background:#2a0d0d;border-color:var(--red);
  color:var(--red);box-shadow:0 0 14px rgba(255,82,82,.3);}
.cbar{display:flex;align-items:center;gap:10px;padding:9px 12px;
  background:var(--bg);border-radius:8px;border:1px solid var(--border);}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.dot.on{background:var(--green);box-shadow:0 0 6px var(--green);}
.dot.err{background:var(--red);}
.ctxt{flex:1;font-size:12px;color:var(--muted);}
.mode-badge{font-size:11px;color:var(--blue);padding:2px 8px;
  border:1px solid var(--blue);border-radius:10px;}
.sbtn{background:var(--green);border:none;border-radius:12px;
  padding:16px;color:#000;font-size:17px;font-weight:800;
  width:100%;cursor:pointer;transition:all .15s;}
.sbtn.run{background:var(--red);color:#fff;}
.sbtn:active{transform:scale(.97);}
@media(min-width:580px){
  main{flex-direction:row;flex-wrap:wrap;}
  .cam-wrap{max-width:380px;}
  .right{flex:1;display:flex;flex-direction:column;gap:12px;min-width:260px;}
}
</style>
</head>
<body>

<div class="overlay" id="load-ov">
  <div class="spinner"></div>
  <h2>Gesture RC Car</h2>
  <p id="load-txt">Loading ML model&hellip;<br>
    <small>~15s first time &middot; cached after</small></p>
</div>

<div class="overlay busy gone" id="busy-ov">
  <div style="font-size:52px">&#x1F512;</div>
  <h2>Car Busy</h2>
  <p>Already controlled by another device.<br>
     Ask them to close the app, then retry.</p>
  <button class="btn" id="busy-btn">&#x21BA; Try Again</button>
</div>

<header>
  <h1>&#x2B21; Gesture RC Car</h1>
  <div class="pills">
    <span class="pill" id="p-cam">&#9679; Cam</span>
    <span class="pill" id="p-ml">&#9679; ML</span>
    <span class="pill" id="p-mqtt">&#9679; Broker</span>
    <span class="pill" id="p-car">&#9679; Car</span>
  </div>
</header>

<main>
  <div class="cam-wrap">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="hud-top">
        <div class="gbadge" id="gbadge">&mdash;</div>
        <div class="fps" id="fps-el">0 fps</div>
      </div>
      <div class="crow">
        <div class="ctrack"><div class="cfill" id="cfill"></div></div>
        <span class="cpct" id="cpct">0%</span>
      </div>
    </div>
  </div>

  <div class="right">
    <div class="card">
      <div class="lbl">Active Command
        <span class="mode-badge">&#9729; Cloud MQTT</span>
      </div>
      <div class="cmd STOP" id="cmd-el">STOP</div>
    </div>
    <div class="card">
      <div class="dpad">
        <div class="db" id="dF">&#9650;</div>
        <div class="dr">
          <div class="db" id="dL">&#9664;</div>
          <div class="db s" id="dS">&#9632;</div>
          <div class="db" id="dR">&#9654;</div>
        </div>
        <div class="db" id="dV">&#9660;</div>
      </div>
    </div>
    <div class="card">
      <div class="lbl">Connection</div>
      <div class="cbar">
        <div class="dot" id="conn-dot"></div>
        <span class="ctxt" id="conn-txt">Connecting to broker&hellip;</span>
      </div>
    </div>
    <button class="sbtn" id="sbtn">&#9654; Start Gesture Control</button>
  </div>
</main>

<!-- MQTT.js — works over WSS from HTTPS pages -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js" crossorigin="anonymous"></script>
<script>
// ── HiveMQ credentials — UPDATE THESE ──────────────────────────
const BROKER_URL  = 'wss://xxxxxxxx.s1.eu.hivemq.cloud:8884/mqtt';
const MQTT_USER   = 'gesturecar';
const MQTT_PASS   = 'YourGeneratedPassword';
const TOPIC_CMD   = 'gesture/car/command';
const TOPIC_STATUS= 'gesture/car/status';

// Unique ID for this controller session
const MY_ID = 'phone_' + Math.random().toString(36).substr(2,8);

const CONF=.85, VOTES=3;
let sess, labels=[], mqttClient, running=false;
let vbuf=[], lastStable='STOP', lastCmd=null, lastSent=0;
let fpsCnt=0,fpsVal=0,fpsT=performance.now();
let camera, hands, carReady=false;

// ── DOM ──────────────────────────────────────────────────────────
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const gbadge=document.getElementById('gbadge');
const fpsEl=document.getElementById('fps-el');
const cfill=document.getElementById('cfill');
const cpct=document.getElementById('cpct');
const cmdEl=document.getElementById('cmd-el');
const connDot=document.getElementById('conn-dot');
const connTxt=document.getElementById('conn-txt');
const sbtn=document.getElementById('sbtn');
const pCam=document.getElementById('p-cam');
const pMl=document.getElementById('p-ml');
const pMqtt=document.getElementById('p-mqtt');
const pCar=document.getElementById('p-car');
const D={FORWARD:document.getElementById('dF'),REVERSE:document.getElementById('dV'),
  LEFT:document.getElementById('dL'),RIGHT:document.getElementById('dR'),
  STOP:document.getElementById('dS')};

const hide=id=>document.getElementById(id).classList.add('gone');
const show=id=>document.getElementById(id).classList.remove('gone');

document.getElementById('busy-btn').addEventListener('click',()=>{
  hide('busy-ov'); connectMQTT();
});

// ── MQTT connection ──────────────────────────────────────────────
function connectMQTT() {
  setConn('wait','Connecting to cloud broker&hellip;');

  mqttClient = mqtt.connect(BROKER_URL, {
    username: MQTT_USER,
    password: MQTT_PASS,
    clientId: MY_ID,
    clean: true,
    reconnectPeriod: 3000,
    connectTimeout: 10000,
  });

  mqttClient.on('connect', () => {
    pMqtt.className='pill on';pMqtt.textContent='● Broker';
    mqttClient.subscribe(TOPIC_STATUS);
    // Send CONNECT to claim car
    publish('CONNECT');
    setConn('wait','Claiming car&hellip;');
    console.log('[MQTT] Connected as:', MY_ID);
  });

  mqttClient.on('message', (topic, msg) => {
    const m = msg.toString();
    if (topic === TOPIC_STATUS) {
      if (m.startsWith('READY:') && m.includes(MY_ID)) {
        carReady = true;
        setConn('on','Car connected &#x2713;');
        pCar.className='pill on';
      } else if (m === 'BUSY:Car already controlled') {
        carReady = false;
        setConn('err','Car busy');
        show('busy-ov');
      } else if (m === 'FREE') {
        carReady = false;
        setConn('err','Car released');
        pCar.className='pill err';
      } else if (m === 'ONLINE') {
        // Car just connected to broker
        publish('CONNECT'); // Re-claim
      }
    }
  });

  mqttClient.on('error', e => {
    pMqtt.className='pill err';
    setConn('err','Broker error: '+e.message);
    console.error('[MQTT] Error:', e);
  });

  mqttClient.on('offline', () => {
    pMqtt.className='pill err';
    setConn('err','Broker offline — reconnecting&hellip;');
    carReady=false;
    pCar.className='pill err';
  });
}

function publish(command) {
  if (!mqttClient?.connected) return;
  mqttClient.publish(TOPIC_CMD, MY_ID+':'+command, {qos:0});
}

function setConn(state,msg){
  const m={on:'on',err:'err',wait:''};
  connDot.className='dot'+(m[state]?' '+m[state]:'');
  connTxt.innerHTML=msg;
}

// ── Cleanup ───────────────────────────────────────────────────
function cleanup(){
  if(mqttClient?.connected){
    publish('DISCONNECT');
    publish('STOP');
    mqttClient.end();
  }
  camera?.stop();
}
window.addEventListener('beforeunload',cleanup);
window.addEventListener('pagehide',cleanup);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&running){
    publish('STOP');
  }
});

// ── Send command via MQTT ─────────────────────────────────────
function send(cmd){
  const now=Date.now();
  if((cmd!==lastCmd||now-lastSent>400)&&carReady){
    publish(cmd);
    lastCmd=cmd;lastSent=now;
  }
}

// ── Vote buffer ───────────────────────────────────────────────
function vote(l,c,h){
  if(!h||c<CONF){vbuf=[];lastStable='STOP';return 'STOP';}
  const cmd=l.toUpperCase();
  if(cmd==='STOP'){vbuf=[];lastStable='STOP';return 'STOP';}
  vbuf.push(cmd);if(vbuf.length>VOTES)vbuf.shift();
  if(vbuf.length>=VOTES&&vbuf.every(v=>v===vbuf[0]))lastStable=vbuf[0];
  return lastStable;
}

// ── Feature extraction ────────────────────────────────────────
function feat(lms){
  const wx=lms[0].x,wy=lms[0].y,wz=lms[0].z,a=[];
  for(const l of lms)a.push(l.x-wx,l.y-wy,l.z-wz);
  const mx=Math.max(...a.map(Math.abs));
  return mx<1e-6?null:new Float32Array(a.map(v=>v/mx));
}

// ── ONNX inference ────────────────────────────────────────────
async function classify(f){
  if(!sess)return null;
  try{
    const t=new ort.Tensor('float32',f,[1,63]);
    const r=await sess.run({float_input:t});
    const p=r['probabilities']?.data
         ||r[Object.keys(r).find(k=>k.toLowerCase().includes('prob'))]?.data;
    if(!p)return null;
    let mi=0,mp=0;p.forEach((v,i)=>{if(v>mp){mp=v;mi=i;}});
    return{label:labels[mi]||'?',conf:mp};
  }catch{return null;}
}

// ── Landmark drawing ──────────────────────────────────────────
const CN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
  [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
const TI=new Set([4,8,12,16,20]);
function drawL(lms){
  const w=cv.width,h=cv.height;
  ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1.5;
  for(const[a,b]of CN){
    ctx.beginPath();ctx.moveTo(lms[a].x*w,lms[a].y*h);
    ctx.lineTo(lms[b].x*w,lms[b].y*h);ctx.stroke();
  }
  lms.forEach((l,i)=>{
    ctx.beginPath();ctx.arc(l.x*w,l.y*h,i===0?6:TI.has(i)?5:3,0,Math.PI*2);
    ctx.fillStyle=i===0?'#ffb300':TI.has(i)?'#00e676':'#4dabf7';ctx.fill();
  });
}

// ── MediaPipe result ──────────────────────────────────────────
async function onRes(res){
  cv.width=res.image.width;cv.height=res.image.height;
  ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(res.image,0,0);
  let g='No hand',c=0,h=false;
  if(res.multiHandLandmarks?.length){
    const lms=res.multiHandLandmarks[0];
    h=true;drawL(lms);
    const f=feat(lms);
    if(f){const r=await classify(f);if(r){g=r.label;c=r.conf;}}
  }
  const cmd=vote(g,c,h);
  gbadge.textContent=g;
  const p=Math.round(c*100);
  cfill.style.width=p+'%';cfill.style.background=p>=85?'#00e676':'#4dabf7';
  cpct.textContent=p+'%';
  cmdEl.textContent=cmd;cmdEl.className='cmd '+cmd;
  Object.entries(D).forEach(([k,el])=>el.classList.toggle('lit',k===cmd));
  fpsCnt++;const now=performance.now();
  if(now-fpsT>=1000){fpsVal=fpsCnt;fpsCnt=0;fpsT=now;
    fpsEl.textContent=fpsVal+' fps';}
  if(running)send(cmd);
}

// ── Camera ────────────────────────────────────────────────────
async function startCamera(){
  if(!hands){
    hands=new Hands({locateFile:f=>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    hands.setOptions({maxNumHands:1,modelComplexity:1,
      minDetectionConfidence:.7,minTrackingConfidence:.6});
    hands.onResults(onRes);
  }
  try{
    const s=await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}});
    const v=document.createElement('video');v.srcObject=s;
    camera=new Camera(v,{onFrame:async()=>{await hands.send({image:v});},
      width:640,height:480});
    await camera.start();pCam.className='pill on';
  }catch{
    pCam.className='pill err';
    alert('Camera denied — allow camera permission and reload.');
  }
}

sbtn.addEventListener('click',async()=>{
  if(!running){
    running=true;sbtn.textContent='&#9209; Stop';sbtn.classList.add('run');
    await startCamera();
  }else{
    running=false;sbtn.textContent='&#9654; Start Gesture Control';
    sbtn.classList.remove('run');send('STOP');camera?.stop();camera=null;
    cmdEl.textContent='STOP';cmdEl.className='cmd STOP';
    Object.values(D).forEach(e=>e.classList.remove('lit'));
  }
});

// ── Load model ────────────────────────────────────────────────
async function loadModel(){
  const lt=document.getElementById('load-txt');
  try{
    lt.innerHTML='Downloading ML model&hellip;<br><small>Cached permanently after first load</small>';
    sess=await ort.InferenceSession.create('./model.onnx',
      {executionProviders:['wasm']});
    lt.innerHTML='Loading labels&hellip;';
    labels=(await(await fetch('./labels.json')).json()).labels;
    hide('load-ov');pMl.className='pill on';
    connectMQTT();
  }catch(e){
    lt.innerHTML='Load failed.<br><small>'+e.message+'</small>';
    pMl.className='pill err';
  }
}

// ── Service worker ────────────────────────────────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js')
    .catch(e=>console.warn('[SW]',e));
}

loadModel();
</script>
</body>
</html>
