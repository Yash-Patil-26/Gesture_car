<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Gesture RC Car</title>
<style>
/* ── Design tokens ─────────────────────────────────────────── */
:root {
  --bg:        #080b10;
  --surface:   #0f1520;
  --surface2:  #151d2e;
  --border:    #1e2d45;
  --text:      #e2e8f4;
  --muted:     #4a6080;
  --green:     #00e5a0;
  --blue:      #38bdf8;
  --amber:     #f59e0b;
  --red:       #f43f5e;
  --purple:    #a78bfa;

  --cmd-FORWARD: var(--green);
  --cmd-REVERSE: var(--blue);
  --cmd-LEFT:    var(--purple);
  --cmd-RIGHT:   var(--amber);
  --cmd-STOP:    var(--red);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ── Loading screen ──────────────────────────────────────────── */
#load-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 999;
}
#load-screen.gone { display: none; }

.spinner {
  width: 44px; height: 44px;
  border: 3px solid var(--border);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.load-title {
  font-size: 20px; font-weight: 700;
  letter-spacing: -0.3px;
}
#load-msg {
  font-size: 13px; color: var(--muted);
  text-align: center; line-height: 1.7;
  max-width: 280px;
}

/* ── Connection overlay ─────────────────────────────────────── */
#conn-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8,11,16,0.92);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 800;
  padding: 24px;
  text-align: center;
  backdrop-filter: blur(4px);
}
#conn-overlay.gone { display: none; }

.conn-icon { font-size: 52px; }
#conn-overlay h2 { font-size: 22px; font-weight: 800; }
#conn-overlay p {
  font-size: 14px; color: var(--muted);
  line-height: 1.8; max-width: 300px;
}
.conn-state-badge {
  padding: 10px 24px;
  border-radius: 40px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.3px;
}
.conn-state-badge.connecting {
  background: rgba(245,158,11,0.15);
  border: 1px solid var(--amber);
  color: var(--amber);
}
.conn-state-badge.busy {
  background: rgba(244,63,94,0.15);
  border: 1px solid var(--red);
  color: var(--red);
}
.conn-state-badge.connected {
  background: rgba(0,229,160,0.15);
  border: 1px solid var(--green);
  color: var(--green);
}
.overlay-btn {
  background: var(--green);
  border: none; border-radius: 12px;
  padding: 13px 32px;
  color: #000; font-size: 15px; font-weight: 800;
  cursor: pointer; width: 100%; max-width: 280px;
}
.overlay-btn:active { transform: scale(0.97); }

/* ── Header ──────────────────────────────────────────────────── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 100;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-hex { font-size: 22px; }
.brand h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }

.status-pills { display: flex; gap: 6px; }
.pill {
  font-size: 10px; font-weight: 600;
  padding: 4px 10px; border-radius: 20px;
  border: 1px solid var(--border);
  color: var(--muted); background: var(--bg);
  letter-spacing: 0.3px;
  transition: all 0.25s;
  white-space: nowrap;
}
.pill.on  { color: var(--green); border-color: var(--green); }
.pill.err { color: var(--red);   border-color: var(--red);   }
.pill.warn{ color: var(--amber); border-color: var(--amber); }

/* ── Main layout ─────────────────────────────────────────────── */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* ── CAMERA — the dominant hero ──────────────────────────────── */
.cam-hero {
  position: relative;
  width: 100%;
  background: #000;
  /* 16:10 ratio gives more vertical space than 4:3 */
  aspect-ratio: 16 / 10;
  flex-shrink: 0;
  overflow: hidden;
}

#cam-canvas {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transform: scaleX(-1);
}

/* Gesture name — large overlay directly on video */
.gesture-overlay {
  position: absolute;
  top: 16px; left: 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
}
.gesture-name {
  font-size: clamp(22px, 5vw, 36px);
  font-weight: 900;
  letter-spacing: -0.5px;
  color: var(--green);
  text-shadow: 0 0 20px rgba(0,229,160,0.4);
  line-height: 1;
  transition: color 0.15s;
}
.gesture-name.no-hand { color: var(--muted); }

.conf-strip {
  display: flex;
  align-items: center;
  gap: 8px;
}
.conf-track {
  width: 140px; height: 4px;
  background: rgba(255,255,255,0.12);
  border-radius: 2px;
  overflow: hidden;
}
.conf-fill {
  height: 100%;
  background: var(--green);
  border-radius: 2px;
  width: 0;
  transition: width 0.1s;
}
.conf-pct {
  font-size: 11px;
  font-weight: 600;
  color: rgba(255,255,255,0.6);
  font-family: monospace;
}

/* FPS and latency — top right of camera */
.cam-meta {
  position: absolute;
  top: 16px; right: 16px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  pointer-events: none;
}
.cam-badge {
  background: rgba(0,0,0,0.6);
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 10px;
  font-family: monospace;
  color: rgba(255,255,255,0.5);
}

/* Active command — bottom left of camera */
.cmd-overlay {
  position: absolute;
  bottom: 16px; left: 16px;
  pointer-events: none;
}
.cmd-big {
  font-size: clamp(28px, 8vw, 56px);
  font-weight: 900;
  letter-spacing: 3px;
  line-height: 1;
  color: var(--red);
  text-shadow: 0 0 30px rgba(244,63,94,0.5);
  transition: color 0.12s, text-shadow 0.12s;
}
.cmd-big.FORWARD {
  color: var(--green);
  text-shadow: 0 0 30px rgba(0,229,160,0.5);
}
.cmd-big.REVERSE {
  color: var(--blue);
  text-shadow: 0 0 30px rgba(56,189,248,0.5);
}
.cmd-big.LEFT {
  color: var(--purple);
  text-shadow: 0 0 30px rgba(167,139,250,0.5);
}
.cmd-big.RIGHT {
  color: var(--amber);
  text-shadow: 0 0 30px rgba(245,158,11,0.5);
}

/* ── Controls panel — compact strip below camera ─────────────── */
.controls-panel {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

/* D-pad */
.dpad {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.dpad-row { display: flex; gap: 4px; }
.dpad-btn {
  width: 52px; height: 52px;
  border-radius: 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--muted);
  transition: all 0.1s;
}
.dpad-btn.lit {
  background: rgba(0,229,160,0.12);
  border-color: var(--green);
  color: var(--green);
  box-shadow: 0 0 12px rgba(0,229,160,0.25);
}
.dpad-btn.lit.stop {
  background: rgba(244,63,94,0.12);
  border-color: var(--red);
  color: var(--red);
  box-shadow: 0 0 12px rgba(244,63,94,0.25);
}

/* Start button */
.start-btn {
  flex: 1;
  min-width: 160px;
  max-width: 280px;
  height: 68px;
  border: none;
  border-radius: 14px;
  background: var(--green);
  color: #000;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.3px;
  cursor: pointer;
  transition: all 0.15s;
}
.start-btn.running {
  background: var(--red);
  color: #fff;
}
.start-btn:active { transform: scale(0.97); }

/* ── Status bar — always visible at bottom ───────────────────── */
.status-bar {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
  transition: all 0.3s;
}
.status-dot.on   { background: var(--green); box-shadow: 0 0 6px var(--green); }
.status-dot.err  { background: var(--red);   box-shadow: 0 0 6px var(--red); }
.status-dot.warn { background: var(--amber); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.4; }
}
.status-text {
  flex: 1;
  font-size: 12px;
  color: var(--muted);
}
.status-text strong { color: var(--text); }
.latency-badge {
  font-size: 10px;
  font-family: monospace;
  color: var(--muted);
  background: var(--surface2);
  padding: 3px 8px;
  border-radius: 5px;
  border: 1px solid var(--border);
}

/* ── Responsive: desktop side-by-side ───────────────────────── */
@media (min-width: 900px) {
  main {
    flex-direction: row;
    flex: 1;
    overflow: hidden;
  }
  .cam-hero {
    flex: 1;
    aspect-ratio: unset;
    height: 100%;
  }
  .right-panel {
    width: 320px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    overflow-y: auto;
  }
  .controls-panel {
    flex-direction: column;
    align-items: stretch;
    flex: 1;
    padding: 20px;
  }
  .dpad { align-items: center; }
  .start-btn { max-width: 100%; }
}

@media (max-width: 899px) {
  .right-panel { display: contents; }
}
</style>
</head>
<body>

<!-- ── Loading screen ── -->
<div id="load-screen">
  <div class="spinner"></div>
  <div class="load-title">⬡ Gesture RC Car</div>
  <p id="load-msg">Loading ML model…<br>
    <small style="color:#2a4060">First load ~15s</small></p>
</div>

<!-- ── Connection overlay ── -->
<div id="conn-overlay" class="gone">
  <div class="conn-icon" id="conn-icon">📡</div>
  <h2 id="conn-title">Connecting</h2>
  <p id="conn-desc">Reaching MQTT broker…</p>
  <div class="conn-state-badge connecting" id="conn-badge">Connecting…</div>
  <button class="overlay-btn gone" id="conn-retry-btn">↺ Retry</button>
</div>

<!-- ── Header ── -->
<header>
  <div class="brand">
    <span class="brand-hex">⬡</span>
    <h1>Gesture RC Car</h1>
  </div>
  <div class="status-pills">
    <span class="pill" id="p-cam">Cam</span>
    <span class="pill" id="p-ml">ML</span>
    <span class="pill" id="p-car">Car</span>
  </div>
</header>

<!-- ── Main ── -->
<main>

  <!-- Camera — dominant hero -->
  <div class="cam-hero">
    <canvas id="cam-canvas"></canvas>

    <!-- Gesture name + confidence — top left -->
    <div class="gesture-overlay">
      <div class="gesture-name no-hand" id="g-name">No hand</div>
      <div class="conf-strip">
        <div class="conf-track">
          <div class="conf-fill" id="c-fill"></div>
        </div>
        <span class="conf-pct" id="c-pct">0%</span>
      </div>
    </div>

    <!-- FPS + latency — top right -->
    <div class="cam-meta">
      <div class="cam-badge" id="fps-badge">0 fps</div>
      <div class="cam-badge" id="lat-badge">—</div>
    </div>

    <!-- Active command — bottom left -->
    <div class="cmd-overlay">
      <div class="cmd-big STOP" id="cmd-big">STOP</div>
    </div>
  </div>

  <!-- Right panel (desktop) / below camera (mobile) -->
  <div class="right-panel">

    <!-- Controls -->
    <div class="controls-panel">

      <!-- D-pad -->
      <div class="dpad">
        <div class="dpad-btn" id="d-FORWARD">▲</div>
        <div class="dpad-row">
          <div class="dpad-btn" id="d-LEFT">◀</div>
          <div class="dpad-btn stop" id="d-STOP">■</div>
          <div class="dpad-btn" id="d-RIGHT">▶</div>
        </div>
        <div class="dpad-btn" id="d-REVERSE">▼</div>
      </div>

      <!-- Start / Stop button -->
      <button class="start-btn" id="start-btn">▶ Start Control</button>

    </div>

  </div>

</main>

<!-- ── Status bar — always at bottom ── -->
<div class="status-bar">
  <div class="status-dot" id="s-dot"></div>
  <span class="status-text" id="s-text">
    <strong>Initialising…</strong>
  </span>
  <div class="latency-badge gone" id="lat-pill"></div>
</div>

<!-- Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js" crossorigin="anonymous"></script>

<script>
// ════════════════════════════════════════════════════════════
// CONFIG — update BROKER_URL with YOUR HiveMQ cluster
// ════════════════════════════════════════════════════════════
const BROKER_URL    = 'wss://29455b01c27447b488b1ec93488ce95d.s1.eu.hivemq.cloud:8884/mqtt';
const BROKER_USER   = 'Mudron';
const BROKER_PASS   = '26crGesture';
const TOPIC_CMD     = 'gesturecar/command';
const TOPIC_STATUS  = 'gesturecar/status';
const CLIENT_ID     = 'gesture_phone_' + Math.random().toString(16).substr(2,8);
const CONF_MIN     = 0.85;
const VOTES        = 3;

// ════════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════════
let session, labels = [];
let mqttClient;
let running      = false;
let carOnline    = false;
let carBusy      = false;
let voteBuf      = [], lastStable = 'STOP';
let lastSentCmd  = null, lastSentTime = 0;
let fpsCnt = 0, fpsTimer = performance.now();
let cameraInst, handsInst;
let pingStart    = 0;
let latencyMs    = 0;

// ════════════════════════════════════════════════════════════
// DOM
// ════════════════════════════════════════════════════════════
const canvas   = document.getElementById('cam-canvas');
const ctx      = canvas.getContext('2d');
const gName    = document.getElementById('g-name');
const cFill    = document.getElementById('c-fill');
const cPct     = document.getElementById('c-pct');
const fpsBadge = document.getElementById('fps-badge');
const latBadge = document.getElementById('lat-badge');
const cmdBig   = document.getElementById('cmd-big');
const startBtn = document.getElementById('start-btn');
const pCam     = document.getElementById('p-cam');
const pMl      = document.getElementById('p-ml');
const pCar     = document.getElementById('p-car');
const sDot     = document.getElementById('s-dot');
const sTxt     = document.getElementById('s-text');
const latPill  = document.getElementById('lat-pill');

const DPAD = ['FORWARD','REVERSE','LEFT','RIGHT','STOP']
  .reduce((o, k) => ({ ...o, [k]: document.getElementById('d-'+k) }), {});

// ════════════════════════════════════════════════════════════
// Connection states — 4 clear states
// ════════════════════════════════════════════════════════════
const CONN_STATES = {
  BROKER_CONNECTING: {
    icon:  '📡',
    title: 'Connecting',
    desc:  'Reaching MQTT broker…',
    badge: 'Connecting…',
    cls:   'connecting',
    dot:   'warn',
    statusMsg: '<strong>Connecting to broker…</strong>',
    showOverlay: false,   // show only in status bar while loading model
    showRetry: false,
  },
  WAITING_FOR_CAR: {
    icon:  '🚗',
    title: 'Car Offline',
    desc:  'Broker connected. Power on the car and make sure it is connected to WiFi.',
    badge: 'Device not connected',
    cls:   'connecting',
    dot:   'warn',
    statusMsg: '<strong>Device not connected</strong> — power on car and check WiFi',
    showOverlay: true,
    showRetry: true,
  },
  CAR_CONNECTED: {
    icon:  '✅',
    title: 'Connected',
    desc:  'Car is online and ready.',
    badge: 'Connected successfully',
    cls:   'connected',
    dot:   'on',
    statusMsg: '<strong>Connected successfully</strong> — car is ready',
    showOverlay: false,
    showRetry: false,
  },
  CAR_BUSY: {
    icon:  '🔒',
    title: 'Try Later!',
    desc:  'Device already connected by another user. Ask them to close the app and try again.',
    badge: 'Device already connected',
    cls:   'busy',
    dot:   'err',
    statusMsg: '<strong>Try later!</strong> Device already connected by another user',
    showOverlay: true,
    showRetry: true,
  },
  BROKER_ERROR: {
    icon:  '⚠️',
    title: 'Connection Failed',
    desc:  'Could not reach the MQTT broker. Check your internet connection.',
    badge: 'Connection error',
    cls:   'busy',
    dot:   'err',
    statusMsg: '<strong>Connection error</strong> — check internet connection',
    showOverlay: true,
    showRetry: true,
  },
};

function applyState(stateKey) {
  const s = CONN_STATES[stateKey];
  if (!s) return;

  // Overlay
  const overlay    = document.getElementById('conn-overlay');
  const retryBtn   = document.getElementById('conn-retry-btn');
  const icon       = document.getElementById('conn-icon');
  const title      = document.getElementById('conn-title');
  const desc       = document.getElementById('conn-desc');
  const badge      = document.getElementById('conn-badge');

  icon.textContent  = s.icon;
  title.textContent = s.title;
  desc.textContent  = s.desc;
  badge.textContent = s.badge;
  badge.className   = 'conn-state-badge ' + s.cls;
  retryBtn.classList.toggle('gone', !s.showRetry);

  // Show overlay for states that need user attention
  if (s.showOverlay) {
    overlay.classList.remove('gone');
  } else {
    overlay.classList.add('gone');
  }

  // Status bar
  sDot.className   = 'status-dot ' + s.dot;
  sTxt.innerHTML   = s.statusMsg;

  // Header pill
  pCar.className   = 'pill ' + (s.dot === 'on' ? 'on' : s.dot === 'warn' ? 'warn' : 'err');
  pCar.textContent = stateKey === 'CAR_CONNECTED' ? 'Car ✓' : 'Car';

  // Latency badge — only show when connected
  if (stateKey === 'CAR_CONNECTED' && latencyMs > 0) {
    latPill.textContent = latencyMs + 'ms';
    latPill.classList.remove('gone');
  } else {
    latPill.classList.add('gone');
  }
}

// ════════════════════════════════════════════════════════════
// MQTT
// ════════════════════════════════════════════════════════════
function connectMQTT() {
  applyState('BROKER_CONNECTING');

  mqttClient = mqtt.connect(wss://29455b01c27447b488b1ec93488ce95d.s1.eu.hivemq.cloud:8884/mqtt, {
    username:        Mudron,
    password:        26crGesture,
    clientId:        gesture_phone_,
    keepalive:       30,
    reconnectPeriod: 4000,
    connectTimeout:  12000,
    clean:           true,
  });

  mqttClient.on('connect', () => {
    console.log('[MQTT] Broker connected');
    // Subscribe to car status
    mqttClient.subscribe(TOPIC_STATUS, err => {
      if (!err) {
        // Ping car to check if it is online
        pingStart = Date.now();
        mqttClient.publish(TOPIC_CMD, 'PING');
        // Wait 4s for response — if none, car is offline
        setTimeout(() => {
          if (!carOnline && !carBusy) {
            applyState('WAITING_FOR_CAR');
          }
        }, 4000);
      }
    });
  });

  mqttClient.on('message', (topic, payload) => {
    const msg = payload.toString();

    if (topic === TOPIC_STATUS) {
      if (msg === 'ONLINE' || msg === 'ALIVE') {
        if (!carBusy) {
          carOnline   = true;
          latencyMs   = Date.now() - pingStart;
          latBadge.textContent = latencyMs + 'ms';
          applyState('CAR_CONNECTED');
          // Update latency badge every 10s
          pingStart = Date.now();
        }
      }
      if (msg.startsWith('BUSY:')) {
        carBusy   = true;
        carOnline = false;
        applyState('CAR_BUSY');
      }
    }
  });

  mqttClient.on('reconnect', () => {
    carOnline = false;
    if (!carBusy) applyState('BROKER_CONNECTING');
  });

  mqttClient.on('error', err => {
    console.error('[MQTT]', err.message);
    applyState('BROKER_ERROR');
  });

  mqttClient.on('offline', () => {
    carOnline = false;
    if (!carBusy) applyState('BROKER_CONNECTING');
  });
}

// Retry button
document.getElementById('conn-retry-btn').addEventListener('click', () => {
  carBusy   = false;
  carOnline = false;
  document.getElementById('conn-overlay').classList.add('gone');
  if (mqttClient) {
    mqttClient.end(true, () => connectMQTT());
  } else {
    connectMQTT();
  }
});

// Periodic car ping
setInterval(() => {
  if (mqttClient?.connected) {
    pingStart = Date.now();
    mqttClient.publish(TOPIC_CMD, 'PING');
    // If no response in 6s, mark car offline
    setTimeout(() => {
      if (Date.now() - pingStart >= 5900 && carOnline && !carBusy) {
        carOnline = false;
        applyState('WAITING_FOR_CAR');
      }
    }, 6000);
  }
}, 12000);

// ════════════════════════════════════════════════════════════
// Send command
// ════════════════════════════════════════════════════════════
function sendCmd(cmd) {
  const now     = Date.now();
  const changed = cmd !== lastSentCmd;
  const beat    = now - lastSentTime > 400;
  if ((changed || beat) && mqttClient?.connected) {
    mqttClient.publish(TOPIC_CMD, cmd, { qos: 0, retain: false });
    lastSentCmd  = cmd;
    lastSentTime = now;
  }
}

// ════════════════════════════════════════════════════════════
// Cleanup on tab close
// ════════════════════════════════════════════════════════════
function cleanup() {
  if (mqttClient?.connected) {
    mqttClient.publish(TOPIC_CMD, 'STOP', { qos: 0 });
  }
  cameraInst?.stop();
}
window.addEventListener('beforeunload', cleanup);
window.addEventListener('pagehide', cleanup);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && running) sendCmd('STOP');
});

// ════════════════════════════════════════════════════════════
// Vote buffer — asymmetric response
// ════════════════════════════════════════════════════════════
function vote(label, conf, hand) {
  if (!hand || conf < CONF_MIN) {
    voteBuf = []; lastStable = 'STOP'; return 'STOP';
  }
  const cmd = label.toUpperCase();
  if (cmd === 'STOP') {
    voteBuf = []; lastStable = 'STOP'; return 'STOP';
  }
  voteBuf.push(cmd);
  if (voteBuf.length > VOTES) voteBuf.shift();
  if (voteBuf.length >= VOTES && voteBuf.every(v => v === voteBuf[0])) {
    lastStable = voteBuf[0];
  }
  return lastStable;
}

// ════════════════════════════════════════════════════════════
// Feature extraction
// ════════════════════════════════════════════════════════════
function extractFeat(lms) {
  const wx = lms[0].x, wy = lms[0].y, wz = lms[0].z;
  const c  = [];
  for (const l of lms) c.push(l.x-wx, l.y-wy, l.z-wz);
  const mx = Math.max(...c.map(Math.abs));
  return mx < 1e-6 ? null : new Float32Array(c.map(v => v/mx));
}

// ════════════════════════════════════════════════════════════
// ONNX inference
// ════════════════════════════════════════════════════════════
async function classify(f) {
  if (!session) return null;
  try {
    const t = new ort.Tensor('float32', f, [1, 63]);
    const r = await session.run({ float_input: t });
    const p = r['probabilities']?.data
           || r[Object.keys(r).find(k => k.toLowerCase().includes('prob'))]?.data;
    if (!p) return null;
    let mi = 0, mp = 0;
    p.forEach((v, i) => { if (v > mp) { mp = v; mi = i; } });
    return { label: labels[mi] || '?', conf: mp };
  } catch { return null; }
}

// ════════════════════════════════════════════════════════════
// Draw landmarks
// ════════════════════════════════════════════════════════════
const CONNS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [0,9],[9,10],[10,11],[11,12],
  [0,13],[13,14],[14,15],[15,16],
  [0,17],[17,18],[18,19],[19,20],
  [5,9],[9,13],[13,17],
];
const TIPS = new Set([4, 8, 12, 16, 20]);

function drawLandmarks(lms) {
  const w = canvas.width, h = canvas.height;
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth   = 1.5;
  for (const [a, b] of CONNS) {
    ctx.beginPath();
    ctx.moveTo(lms[a].x * w, lms[a].y * h);
    ctx.lineTo(lms[b].x * w, lms[b].y * h);
    ctx.stroke();
  }
  lms.forEach((l, i) => {
    ctx.beginPath();
    ctx.arc(l.x * w, l.y * h, i === 0 ? 6 : TIPS.has(i) ? 5 : 3, 0, Math.PI * 2);
    ctx.fillStyle = i === 0 ? '#f59e0b' : TIPS.has(i) ? '#00e5a0' : '#38bdf8';
    ctx.fill();
  });
}

// ════════════════════════════════════════════════════════════
// MediaPipe result
// ════════════════════════════════════════════════════════════
async function onResults(res) {
  canvas.width  = res.image.width;
  canvas.height = res.image.height;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(res.image, 0, 0);

  let gesture = 'No hand', conf = 0, hand = false;

  if (res.multiHandLandmarks?.length > 0) {
    const lms = res.multiHandLandmarks[0];
    hand = true;
    drawLandmarks(lms);
    const f = extractFeat(lms);
    if (f) {
      const r = await classify(f);
      if (r) { gesture = r.label; conf = r.conf; }
    }
  }

  const cmd = vote(gesture, conf, hand);

  // Update gesture overlay
  gName.textContent = gesture;
  gName.classList.toggle('no-hand', !hand);

  const pct = Math.round(conf * 100);
  cFill.style.width      = pct + '%';
  cFill.style.background = pct >= 85 ? '#00e5a0' : '#38bdf8';
  cPct.textContent       = pct + '%';

  // Update command overlay
  cmdBig.textContent = cmd;
  cmdBig.className   = 'cmd-big ' + cmd;

  // Update D-pad
  Object.entries(DPAD).forEach(([k, el]) =>
    el.classList.toggle('lit', k === cmd));

  // FPS
  fpsCnt++;
  const now = performance.now();
  if (now - fpsTimer >= 1000) {
    fpsBadge.textContent = fpsCnt + ' fps';
    fpsCnt = 0; fpsTimer = now;
  }

  // Update latency badge
  if (latencyMs > 0) {
    latBadge.textContent = latencyMs + 'ms via cloud';
  }

  if (running) sendCmd(cmd);
}

// ════════════════════════════════════════════════════════════
// Camera
// ════════════════════════════════════════════════════════════
async function startCamera() {
  if (!handsInst) {
    handsInst = new Hands({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });
    handsInst.setOptions({
      maxNumHands:            1,
      modelComplexity:        1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence:  0.6,
    });
    handsInst.onResults(onResults);
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    const vid = document.createElement('video');
    vid.srcObject = stream;
    cameraInst = new Camera(vid, {
      onFrame: async () => { await handsInst.send({ image: vid }); },
      width: 1280, height: 720,
    });
    await cameraInst.start();
    pCam.classList.add('on');
    pCam.textContent = 'Cam ✓';
  } catch (err) {
    pCam.classList.add('err');
    alert('Camera access denied. Allow camera in browser settings and reload.');
  }
}

// ════════════════════════════════════════════════════════════
// Start button
// ════════════════════════════════════════════════════════════
startBtn.addEventListener('click', async () => {
  if (!running) {
    running = true;
    startBtn.textContent = '⏹ Stop';
    startBtn.classList.add('running');
    await startCamera();
  } else {
    running = false;
    startBtn.textContent = '▶ Start Control';
    startBtn.classList.remove('running');
    sendCmd('STOP');
    cameraInst?.stop(); cameraInst = null;
    cmdBig.textContent = 'STOP'; cmdBig.className = 'cmd-big STOP';
    Object.values(DPAD).forEach(el => el.classList.remove('lit'));
  }
});

// ════════════════════════════════════════════════════════════
// Load model and start
// ════════════════════════════════════════════════════════════
async function init() {
  const loadMsg = document.getElementById('load-msg');
  try {
    loadMsg.innerHTML = 'Downloading ML model…<br><small style="color:#2a4060">~10MB · one time</small>';
    session = await ort.InferenceSession.create('./model.onnx', {
      executionProviders: ['wasm']
    });

    loadMsg.innerHTML = 'Loading gesture labels…';
    labels = (await (await fetch('./labels.json')).json()).labels;

    // Hide load screen
    document.getElementById('load-screen').classList.add('gone');
    pMl.classList.add('on');
    pMl.textContent = 'ML ✓';

    // Connect MQTT
    connectMQTT();

  } catch (err) {
    loadMsg.innerHTML = `Load failed.<br><small style="color:#f43f5e">${err.message}</small>`;
    pMl.classList.add('err');
    console.error('[INIT]', err);
  }
}

init();
</script>
